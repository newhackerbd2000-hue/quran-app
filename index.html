const ISL=/(quran|qur.an|koran|islam|muslim|makkah|mecca|madina|medina|haram|sunna|sunnah|sunnat|hadith|huda|madani|iqra|peace ?tv|noor|nur ?tv|deen|hidayat|hidaya|risala|resala|tarteel|tilawa|azan|adhan|hajj|umrah|dawah|dawa|tafsir|surah|bayyinah|qtv|q tv|takbeer|rahmat|iman|jannah|ummah|almajd|al majd|sirat|noorani|hilal|mustafa|tahrir|bangla islam|ilm)/i;
const EXC=/(christ|jesus|gospel|church|bible|catholic|hindu|buddh|sikh|jain|angel|tbn|ewtn|god ?tv|3abn|prayer ?tv|daystar|hillsong|evangel|krishna|bhakti|sanskar|aastha|sadhna|shalom|kingdom|mass |rosary)/i;
function parseM3U(t){const out=[],L=t.split(/\r?\n/);for(let i=0;i<L.length;i++){const l=L[i];if(!l.startsWith('#EXTINF'))continue;const at={};l.replace(/([\w-]+)="([^"]*)"/g,(m,k,v)=>{at[k]=v});const name=(l.slice(l.lastIndexOf(',')+1)||at['tvg-name']||'').trim();let u='';for(let j=i+1;j<L.length&&j<i+5;j++){if(L[j]&&!L[j].startsWith('#')){u=L[j].trim();break}}if(u)out.push({name,url:u,logo:at['tvg-logo']||'',cc:((at['tvg-id']||'').split('.').pop()||'').toUpperCase().slice(0,3)})}return out}
let TVL_Q=null,TVL_I=null;
async function tvQuick(){if(TVL_Q)return TVL_Q;const lang=MQL[S.lang]||'eng',seen=new Set(),out=[];const add=(n,u,logo,cc,src)=>{if(!u||!/^https:/i.test(u))return;const k=u.split('?')[0];if(seen.has(k))return;seen.add(k);out.push({name:n,url:u,logo,cc,src})};
 try{const j=await jget(`https://www.mp3quran.net/api/v3/live-tv?language=${lang}`,{timeout:9000});firstArr(j,['livetv','live_tv','tv','channels']).forEach(x=>add(x.name||x.title,x.url||x.link||x.stream,'','','mq'))}catch(e){}
 FALLBACK_TV.forEach(x=>add(x.name,x.url,'','','mq'));return TVL_Q=out}
async function tvIptv(){if(TVL_I)return TVL_I;const out=[];
 try{const u='https://iptv-org.github.io/iptv/categories/religious.m3u',c=await cacheOpen('qa-api-v1');let txt='';try{txt=await tget(u,10000);if(c)c.put(u,new Response(txt))}catch(e){if(c){const m=await c.match(u);if(m)txt=await m.text()}}
  parseM3U(txt).filter(x=>ISL.test(x.name)&&!EXC.test(x.name)).forEach(x=>out.push({name:x.name.replace(/\s*\(\d+p\)|\s*\[.*?\]/g,''),url:x.url,logo:x.logo,cc:x.cc,src:'iptv'}))}catch(e){}
 return TVL_I=out}
async function tvChannels(){const[a,b]=await Promise.all([tvQuick(),tvIptv()]);const seen=new Set(a.map(x=>x.url.split('?')[0]));return a.concat(b.filter(x=>!seen.has(x.url.split('?')[0])))}
const tvRow=(pk,u,n,icon,act,sub,logo)=>`<div class="li" data-act="${act}" data-pk="${esc(pk)}" data-u="${esc(u)}" data-n="${esc(n)}" data-q="${esc(n+' '+(sub||''))}"><span class="no tvl">${logo?`<img src="${esc(logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}${ico(icon)}</span><div class="t"><b>${esc(n)}</b>${sub?`<small>${esc(sub)}</small>`:''}</div>${eqH}${ico('play','go')}</div>`;
VIEWS.tv=async()=>{const tok=viewTok,m=$('#main');setTop({title:T('t_tv')});tvPk='';
 m.innerHTML=`<div class="tabs">${[['tv','tv'],['radio','radio'],['video','video']].map(([t,ic])=>`<button data-act="tvTab" data-t="${t}" class="${tvTab===t?'on':''}">${ico(ic)}${T(t)}</button>`).join('')}</div><div id="vbox" class="pad" hidden><video id="vid" controls playsinline></video><div class="row" style="margin-top:8px"><b id="vt" class="sp"></b>${IB('vidClose','close','','s')}</div><div class="muted sm" id="vmsg"></div></div><div class="sbar"><input class="inp" data-inp="tvFilter" placeholder="${T('search_ph')}"></div><div id="tvl">${loading()}</div>`;
 const box=()=>$('#tvl');const lang=MQL[S.lang]||'eng';
 try{if(tvTab==='tv'){const q=await tvQuick();if(isStale(tok))return;box().innerHTML=`<div class="pad sm muted" id="tvcnt">${NF(q.length)} ${S.lang==='bn'?'টি চ্যানেল · আরও চ্যানেল আনা হচ্ছে…':'channels · fetching more…'}</div>`+q.map(x=>tvRow('tv:'+x.url,x.url,x.name,'tv','playTv',[x.cc,x.src==='mq'?'mp3quran':''].filter(Boolean).join(' · '),x.logo)).join('');markPlaying();
   tvIptv().then(iptv=>{if(isStale(tok))return;const seen=new Set(q.map(x=>x.url.split('?')[0])),extra=iptv.filter(x=>!seen.has(x.url.split('?')[0]));const cnt=$('#tvcnt');if(cnt)cnt.textContent=`${NF(q.length+extra.length)} ${S.lang==='bn'?'টি ইসলামিক চ্যানেল (কিছু চ্যানেল সাময়িক বন্ধ থাকতে পারে)':'Islamic channels (some may be temporarily offline)'}`;if(extra.length)box().insertAdjacentHTML('beforeend',extra.map(x=>tvRow('tv:'+x.url,x.url,x.name,'tv','playTv',[x.cc,'IPTV'].filter(Boolean).join(' · '),x.logo)).join(''));markPlaying()}).catch(()=>{})}
  else if(tvTab==='radio'){const j=await jget(`https://www.mp3quran.net/api/v3/radios?language=${lang}`,{timeout:15000});const items=firstArr(j,['radios']);if(isStale(tok))return;box().innerHTML=items.map(x=>tvRow('rd:'+x.url,x.url,x.name,'radio','playRadio',T('live'))).join('')||`<div class="empty">${T('no_result')}</div>`}
  else{const j=await jget(`https://www.mp3quran.net/api/v3/videos?language=${lang}`,{timeout:20000});const items=firstArr(j,['videos']);if(isStale(tok))return;const flat=[];items.forEach(x=>{if(Array.isArray(x.videos))x.videos.forEach(v=>flat.push({name:(x.reciter_name||x.name||'')+(v.video_type?' — '+v.video_type:''),url:v.video_url||v.url}));else flat.push({name:x.reciter_name||x.name||x.title||'',url:x.video_url||x.url})});
   box().innerHTML=flat.filter(x=>x.url).slice(0,150).map(x=>tvRow('tv:'+x.url,x.url,x.name,'video','playTv','')).join('')||`<div class="empty">${T('no_result')}</div>`}
  markPlaying()}catch(e){if(box())box().innerHTML=errBox()}};
ACT.tvFilter=v=>{const q=v.trim().toLowerCase();$$('#tvl .li').forEach(e=>e.style.display=(!q||e.dataset.q.toLowerCase().includes(q))?'':'none')};
ACT.tvTab=d=>{tvTab=d.t;render(cur)};
ACT.playTv=async(d,el)=>{Player.stopUI();const v=$('#vid');$('#vbox').hidden=false;$('#vt').textContent=d.n;$('#vmsg').textContent=T('loading');const u=d.u;if(window.hlsI){window.hlsI.destroy();window.hlsI=null}
 v.onplay=()=>{tvPk=el.dataset.pk;$('#vmsg').textContent='';markPlaying()};v.onpause=()=>{tvPk='';markPlaying()};v.onended=v.onpause;
 v.onerror=()=>{const mm=$('#vmsg');if(mm)mm.textContent=S.lang==='bn'?'এই চ্যানেলটি এখন চলছে না—অন্য চ্যানেল চেষ্টা করুন।':'This channel is not available right now — try another.'};
 const native=v.canPlayType('application/vnd.apple.mpegurl');
 if(/\.m3u8/i.test(u)&&!native){try{await loadHls();if(Hls.isSupported()){const h=window.hlsI=new Hls({lowLatencyMode:true});h.on(Hls.Events.ERROR,(e,dt)=>{if(dt.fatal){$('#vmsg').textContent=S.lang==='bn'?'চ্যানেল লোড হচ্ছে না—অন্য চ্যানেল চেষ্টা করুন।':'Channel failed to load — try another.';h.destroy()}});h.loadSource(u);h.attachMedia(v)}else v.src=u}catch(e){v.src=u}}else v.src=u;
 v.play().catch(()=>{});$('#main').scrollTop=0};
ACT.vidClose=()=>{const v=$('#vid');v.pause();v.removeAttribute('src');v.load();$('#vbox').hidden=true;tvPk='';markPlaying()};
ACT.playRadio=d=>Player.start([{url:d.u,pk:'rd:'+d.u,title:d.n,sub:T('live')}],0,{tag:'radio'});

</script>
</body>
